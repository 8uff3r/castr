        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Live Feeds</span>

</div>

        <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Online Viewers</span>
        <span class="text-3xl font-extrabold text-white tracking-tight" id="stat-online-viewers">{{ total_viewers | default(value=0) }}</span>
