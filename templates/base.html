<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default(value="Castr — RTMP Live Webcam Streaming Hub") }}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- mpegts.js for Ultra-Low Latency HTTP-FLV Live Streaming -->
    <script src="/mpegts.js"></script>
    <!-- HTMX for Server-Driven UI Partial Polling -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Alpine.js for Lightweight Reactive Client UI State -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-black antialiased overflow-x-hidden flex flex-col justify-between">
    <!-- Ambient Neon Background Glows -->
    <div class="fixed top-[-10%] left-[5%] w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[5%] w-[700px] h-[700px] bg-blue-600/10 rounded-full blur-[160px] pointer-events-none z-0"></div>

    <!-- Top Navigation Bar (Full Width Glass Header) -->
    <header class="sticky top-0 z-50 glass-nav px-4 sm:px-8 lg:px-12 py-4 transition-all shadow-xl">
        <div class="w-full max-w-[1800px] mx-auto flex items-center justify-between gap-6">
            <!-- Brand Logo -->
            <div class="flex items-center gap-3.5 cursor-pointer group" onclick="app.showExplore()">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-2xl shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition-transform duration-300">
                    ⚡
                </div>
                <div class="flex items-center gap-2 font-extrabold text-2xl tracking-tight">
                    <span class="text-white">Castr</span>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">LIVE</span>
                    <span class="text-[10px] font-mono font-bold px-2.5 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 tracking-widest uppercase shadow-sm">RTMP HUB</span>
                </div>
            </div>

            <!-- Global Search Bar -->
            <div class="flex-1 max-w-xl relative hidden md:block">
                <input 
                    type="text" 
                    id="search-input" 
                    name="search"
                    placeholder="Search active live webcams, broadcasters, or stream keys..." 
                    oninput="app.filterStreams()"
                    hx-get="/api/partials/streams"
                    hx-trigger="input changed delay:300ms, search"
                    hx-target="#streams-grid"
                    class="w-full bg-slate-950/90 border border-slate-800/90 rounded-full py-2.5 pl-5 pr-11 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/30 transition-all shadow-inner"
                >
                <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-sm">🔍</div>
            </div>

            <!-- Auth / Actions Navigation -->
            <div class="flex items-center gap-3.5" id="auth-nav-section">
                <button 
                    class="px-5 py-2.5 rounded-full text-sm font-semibold border border-slate-700/80 hover:border-slate-500 hover:bg-slate-800/80 text-slate-300 transition-all cursor-pointer shadow-sm"
                    onclick="app.openAuthModal('login')"
                >
                    Log In
                </button>
                {% if not disable_registration %}
                <button 
                    class="px-5 py-2.5 rounded-full text-sm font-bold bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 hover:from-cyan-400 hover:to-blue-500 transition-all shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 cursor-pointer"
                    onclick="app.openAuthModal('register')"
                >
                    Register to Watch
                </button>
                {% endif %}
            </div>

            <!-- Logged In User Navigation (Hidden Initially) -->
            <div class="hidden items-center gap-3.5" id="user-nav-section">
                <button 
                    class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold bg-cyan-500/15 text-cyan-300 border border-cyan-500/40 hover:bg-cyan-500/25 transition-all cursor-pointer shadow-sm"
                    onclick="app.openRtmpModal()"
                >
                    <span>📡</span> RTMP Setup Guide
                </button>
                <div class="flex items-center gap-2.5 pl-2.5 pr-4 py-1.5 bg-slate-950/80 border border-slate-800 rounded-full shadow-inner">
                    <span class="w-7 h-7 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 text-slate-950 font-extrabold text-xs flex items-center justify-center uppercase shadow-sm" id="nav-user-avatar">U</span>
                    <span class="text-xs font-bold text-slate-200 truncate max-w-[140px]" id="nav-username">@username</span>
                </div>
                <button 
                    class="text-xs text-slate-400 hover:text-rose-400 transition-colors cursor-pointer px-3 py-1.5 font-semibold rounded-full hover:bg-rose-500/10"
                    onclick="app.logout()"
                >
                    Log Out
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Workspace (Full Width, Spanning up to 1800px) -->
    <main class="relative z-10 w-full max-w-[1800px] mx-auto px-4 sm:px-8 lg:px-12 py-8 flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-900 bg-slate-950/80 py-6 px-6 text-center text-xs font-mono text-slate-600 z-10 mt-12">
        <div class="max-w-[1800px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span>⚡ CASTR ENGINE</span> • <span>ASYNC RUST + HTTP-FLV + RTMP INGEST</span>
            </div>
            <div class="flex items-center gap-4 text-slate-500">
                <span>Tailwind CSS v4</span>
                <span>Tera Templates</span>
                <span>HTMX Polling</span>
                <span>Alpine.js UI</span>
            </div>
        </div>
    </footer>

    <!-- Modals Block -->
    {% block modals %}{% endblock %}

    <script src="/app.js"></script>
</body>
</html>
